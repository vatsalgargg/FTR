# Static application security testing for the Worker, the site scripts and the workflows themselves.
name: CodeQL

# Pushes and pull requests run only when code or workflows change; the weekly run covers everything.
on:
  push:
    branches: [main]
    paths: ["**/*.js", "**/*.mjs", ".github/workflows/**", "package-lock.json"]
  pull_request:
    paths: ["**/*.js", "**/*.mjs", ".github/workflows/**", "package-lock.json"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload results to the repository's code scanning alerts.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - dist/vendor
              - dist/assets/*.min.js
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
